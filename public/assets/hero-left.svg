<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="paperWash" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fbf9fa" />
      <stop offset="65%" stop-color="#f2eef4" />
      <stop offset="100%" stop-color="#e8e2ec" />
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.045" />
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Subtle textured paper ground -->
  <rect width="600" height="600" fill="url(#paperWash)" />
  <rect width="600" height="600" filter="url(#grain)" />

  <!-- Thin gallery inner frame -->
  <rect x="28" y="28" width="544" height="544" stroke="#14100e" stroke-opacity="0.14" stroke-width="1" />

  <!-- Vertical falling ink rain lines -->
  <g stroke="#14100e" stroke-opacity="0.22" stroke-width="1">
    <line x1="126" y1="68" x2="126" y2="148" />
    <line x1="178" y1="110" x2="178" y2="172" />
    <line x1="422" y1="74" x2="422" y2="156" />
    <line x1="472" y1="138" x2="472" y2="210" />
    <line x1="252" y1="60" x2="252" y2="104" />
    <line x1="354" y1="86" x2="354" y2="134" />
  </g>

  <!-- Delicate concentric water ripples at bottom -->
  <g stroke="#14100e" fill="none">
    <ellipse cx="300" cy="436" rx="158" ry="26" stroke-opacity="0.16" stroke-width="1" />
    <ellipse cx="300" cy="436" rx="112" ry="18" stroke-opacity="0.26" stroke-width="1" />
    <ellipse cx="300" cy="436" rx="64" ry="10" stroke-opacity="0.4" stroke-width="1.1" />
    <ellipse cx="300" cy="436" rx="24" ry="4" stroke-opacity="0.55" stroke-width="1.2" />
  </g>

  <!-- Minimalist botanical stems rising delicately from left & right -->
  <g stroke="#14100e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.72">
    <path d="M168 430 C176 364 198 310 232 262" />
    <path d="M196 346 C174 334 160 318 156 300 C176 304 192 318 196 346 Z" fill="#14100e" fill-opacity="0.05" />
    <path d="M210 302 C226 286 244 278 260 280 C248 296 230 306 210 302 Z" fill="#14100e" fill-opacity="0.05" />
    <circle cx="236" cy="256" r="5" fill="#fbf9fa" />

    <path d="M432 430 C424 374 402 326 368 286" />
    <path d="M406 360 C426 348 442 334 446 316 C428 320 412 336 406 360 Z" fill="#14100e" fill-opacity="0.05" />
    <path d="M390 318 C374 304 358 298 344 300 C356 314 372 322 390 318 Z" fill="#14100e" fill-opacity="0.05" />
    <circle cx="364" cy="280" r="4.5" fill="#fbf9fa" />
  </g>

  <!-- Central Shizuku (雫) Ink Droplet with fine cross-hatch highlight -->
  <g transform="translate(300 250)">
    <path
      d="M0 -98 C0 -98 -56 -16 -56 30 C-56 62 -31 86 0 86 C31 86 56 62 56 30 C56 -16 0 -98 0 -98 Z"
      fill="#ffffff"
      fill-opacity="0.72"
      stroke="#14100e"
      stroke-width="1.6"
    />
    <!-- Inner delicate botanical/ripple linework inside droplet -->
    <path
      d="M0 -68 C0 -68 -36 -10 -36 26 C-36 47 -20 64 0 64 C20 64 36 47 36 26 C36 -10 0 -68 0 -68 Z"
      stroke="#14100e"
      stroke-opacity="0.22"
      stroke-width="1"
    />
    <path
      d="M-24 22 C-24 4 -12 -18 -2 -36"
      stroke="#14100e"
      stroke-opacity="0.55"
      stroke-width="1.2"
      stroke-linecap="round"
    />
    <circle cx="14" cy="36" r="14" stroke="#745bc7" stroke-opacity="0.45" stroke-width="1" />
    <circle cx="14" cy="36" r="5" fill="#14100e" fill-opacity="0.75" />
    <!-- Falling micro-drop -->
    <path
      d="M0 108 C0 108 -7 120 -7 126 A7 7 0 0 0 7 126 C7 120 0 108 0 108 Z"
      fill="#14100e"
      fill-opacity="0.82"
    />
  </g>

  <!-- Quiet Japanese editorial ink stamp -->
  <text
    x="56"
    y="78"
    fill="#14100e"
    fill-opacity="0.65"
    font-family="Georgia, serif"
    font-size="13"
    letter-spacing="4"
  >
    SHIKAS · 雫
  </text>
  <text
    x="544"
    y="546"
    text-anchor="end"
    fill="#14100e"
    fill-opacity="0.42"
    font-family="monospace"
    font-size="10"
    letter-spacing="2"
  >
    PERSONAL CASHFLOW ARCHIVE
  </text>
</svg>

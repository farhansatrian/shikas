name: Build and Push SHIKAS Image to GHCR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shikas:latest
            ghcr.io/${{ github.repository_owner }}/shikas:${{ github.sha }}
          build-args: |
            VITE_SHIZUKU_URL=${{ vars.VITE_SHIZUKU_URL }}
            VITE_SHIZUKU_API_URL=${{ vars.VITE_SHIZUKU_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
